    <script>
      // Gracefully prevent unhandled WebSocket/HMR reconnection noise in preview sandbox
      (function () {
        if (typeof window !== 'undefined' && window.WebSocket) {
          var NativeWS = window.WebSocket;
          window.WebSocket = function (url, protocols) {
            if (
              protocols === 'vite-hmr' ||
              (typeof url === 'string' && (url.indexOf('vite') !== -1 || url.indexOf('@vite') !== -1))
            ) {
              var target = new EventTarget();
              target.binaryType = 'blob';
              target.readyState = 1;
              target.bufferedAmount = 0;
              target.send = function () {};
              target.close = function () {};
              setTimeout(function () {
                target.dispatchEvent(new Event('open'));
              }, 0);
              return target;
            }
            return new NativeWS(url, protocols);
          };
          window.WebSocket.prototype = NativeWS.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        window.addEventListener('unhandledrejection', function (e) {
          var msg = (e.reason && (e.reason.message || e.reason.toString())) || '';
          if (typeof msg === 'string' && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1)) {
            e.preventDefault();
            e.stopImmediatePropagation && e.stopImmediatePropagation();
          }
        });
        window.addEventListener('error', function (e) {
          var msg = e.message || '';
          if (typeof msg === 'string' && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1)) {
            e.preventDefault();
            e.stopImmediatePropagation && e.stopImmediatePropagation();
          }
        });
      })();
    </script>
